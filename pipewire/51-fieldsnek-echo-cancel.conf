context.modules = [

  {
    name  = libpipewire-module-echo-cancel
    args  = {
      capture.props  = {
        node.name        = "fieldsnek-ec-source"
        node.description = "FieldSnek Echo Cancel (mic)"
        media.class      = "Audio/Source"
        node.nick        = "FieldSnek EC Mic"
      }
      playback.props = {
        node.name        = "fieldsnek-ec-sink"
        node.description = "FieldSnek Echo Cancel (monitor)"
        media.class      = "Audio/Sink"
      }
      monitor.props  = {
        node.name        = "fieldsnek-ec-monitor"
        media.class      = "Stream/Output/Audio"
      }

      aec.args = {
        webrtc.extended_filter  = true
        webrtc.delay_agnostic   = true
        webrtc.analog_gain_control = false
        webrtc.digital_gain_control = true
        webrtc.noise_suppression = true
        webrtc.voice_detection  = true

        clock.rate              = 16000
        clock.allowed-rates     = [ 16000 48000 ]
      }
    }
    flags = [ ifexists nofail ]
  }

  {
    name  = libpipewire-module-filter-chain
    args  = {
      node.name         = "fieldsnek-rnnoise"
      node.description  = "FieldSnek Echo Cancel"

      media.class       = "Audio/Source/Virtual"
      node.nick         = "FieldSnek Echo Cancel"

      filter.graph = {
        nodes = [
          {
            type   = builtin
            label  = copy
            name   = passthrough
          }
          {
            type   = ladspa
            name   = rnnoise
            plugin = librnnoise_ladspa
            label  = noise_suppressor_stereo
          }
        ]
        links = [
          { output = "passthrough:Out L"  input = "rnnoise:Input L" }
          { output = "passthrough:Out R"  input = "rnnoise:Input R" }
        ]
      }

      capture.props = {
        node.name    = "fieldsnek-rnnoise.input"
        media.class  = "Audio/Sink"
        target.object = "fieldsnek-ec-source"
      }
      playback.props = {
        node.name    = "fieldsnek-rnnoise.output"
        media.class  = "Audio/Source"
        node.nick    = "FieldSnek Echo Cancel"
        node.description = "FieldSnek Echo Cancel"
      }
    }
    flags = [ ifexists nofail ]
  }

]
