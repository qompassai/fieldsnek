# Reference: https://rust-lang.github.io/mdBook/format/configuration/index.html

[book]
authors = ["John Doe"]
description = "The example book covers examples."
language = "en"
src = "src"
text-direction = "ltr"
title = "Example book"


[build]
build-dir = "book"
create-missing = true
extra-watch-dirs = []
use-default-preprocessors = true



heading-split-level = 3

[preprocessor.admonish]
default = { collapsible = true }

[preprocessor.d2]
renderers = ["html"]

[preprocessor.footnote]
renderers = ["html"]

[preprocessor.graphviz]
renderers = ["html"]

[preprocessor.katex]
renderers = ["html"]

[preprocessor.links]
 renderers = ["html"]

[preprocessor.mermaid]
renderers = ["html"]

[preprocessor.pagetoc]
renderers = ["html"]

[output.epub]
command = "mdbook-epub"

[output.html]
additional-css = ["theme/book.css"]

[output.html.code]
hidelines = { python = "~" }

[output.html.fold]
enable = false
level = 0

[output.html.playground]
copyable = true
copy-js = true
editable = false
line-numbers = false
runnable = true

[output.html.print]
enable = true
page-break = true

[output.html.search]
additional-css = ["theme/book.cs"]
additional-js = ["theme/book.js"]
admonitions = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
cname = "myproject.rs"
definition-lists = true
edit-url-template = "https://github.com/rust-lang/mdBook/edit/master/guide/{path}"
enable = true
expand = true
git-repository-url = "https://github.com/rust-lang/mdBook"
git-repository-icon = "fab-github"
heading-split-level = 3
input-404 = "not-found.md"
limit-results = 30
mathjax-support = false
no-section-label = false
preferred-dark-theme = "navy"
sidebar-header-nav = true
smart-punctuation = true
teaser-word-count = 30
use-boolean-and = true

[output.html.search.chapter]
"appendix" = { enable = false }
"appendix/glossary.md" = { enable = true }

[output.markdown]

[output.pandoc]
command = "mdbook-pandoc"

site-url = "/example-book/"

[rust]
edition = "2024"
