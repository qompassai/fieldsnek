#:tombi schema.strict = false

[project]
name = "ontrack"
version = "0.1.0"
description = "Ontrack"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Matt A. Porter", email = "map@qompassai.ai" }]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "Pillow>=9.0",
  "faster-whisper>=1.0",
  "folium>=0.14",
  "geopy>=2.3",
  "openpyxl>=3.0",
  "ortools>=9.5",
  "pandas>=1.5",
  "python-dotenv>=1.0",
  "requests>=2.28",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/qompassai/ONTrack"
Repository = "https://github.com/qompassai/ONTrack"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.coverage.run]
source = ["core", "config", "gui", "mobile"]
omit = ["tests/*", "assets/*", "installer/*"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ontrack"
python-source = "."

[tool.pip]
index-url = "https://pypi.org/simple/"
no-extra-index-url = true

[tool.pytest.ini_options]
markers = [
  "linux:    Linux x86_64 build checks",
  "windows:  Windows 11 build checks",
  "android:  Android/Buildozer packaging checks",
  "integration: Requires faster-whisper and sounddevice installed",
  "hardware: Requires a real microphone (never runs in CI)",
]
pythonpath = ["."]
testpaths = ["tests"]
